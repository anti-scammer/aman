<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Aman video card</title>
<style>
  /* ------------------------------------------------------------------
     Full-frame cards for the walkthrough video, rendered at 1920x1080 by
     render-cards.mjs and handed to ffmpeg as stills.

     They deliberately reuse the product's glass design system rather than a
     separate "video look", so a title card and a screen recording of the app
     sitting next to each other read as one piece. render-cards.mjs injects the
     scene data and the font as data URIs, so this file renders identically
     offline and never touches the network.
     ------------------------------------------------------------------ */

  :root {
    --brand-950: #082916;
    --brand-900: #0c3b20;
    --brand-800: #104a27;
    --brand-700: #14532d;
    --brand-500: #1a6b3c;
    --brand-400: #2f8a55;
    --brand-200: #bfe0cb;
    --brand-100: #dcefe2;
    --brand-50:  #edf6f0;
    --olive:     #f4c95d;
    --accent:    #ce1126;

    --glass-face: linear-gradient(158deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    --glass-edge: rgba(255,255,255,.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
  }

  body {
    font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(1100px 620px at 82% -14%, rgba(47,138,85,.5), transparent 66%),
      radial-gradient(760px 520px at 6% 108%, rgba(143,211,168,.24), transparent 68%),
      radial-gradient(620px 420px at 58% 118%, rgba(244,201,93,.14), transparent 70%),
      linear-gradient(152deg, var(--brand-950) 0%, var(--brand-900) 46%, var(--brand-700) 100%);
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }

  /* Faint tatreez diamond lattice, the same motif the web hero uses. */
  body::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.05) 0 1px, transparent 1px 26px);
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.2));
  }

  .frame { position: relative; width: 1520px; }

  /* ---------- shared bits ---------- */
  .eyebrow {
    display: inline-flex; align-items: center; gap: 14px;
    background: var(--glass-face);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28);
    border-radius: 999px; padding: 12px 30px;
    font-size: 30px; font-weight: 500; color: #cfe8d9;
    margin-bottom: 34px;
  }
  .mark { width: 34px; height: 34px; display: block; }

  h1 { font-size: 96px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
  .sub { font-size: 40px; color: #c8e0d3; line-height: 1.55; margin-top: 22px; }
  .foot { font-size: 27px; color: #8fbfa2; margin-top: 44px; }

  /* ---------- kind: title ---------- */
  .title-card { text-align: center; display: grid; justify-items: center; }
  .title-card .logo { width: 200px; height: 200px; margin-bottom: 44px; }
  .title-card h1 { font-size: 158px; }
  .title-card .sub { font-size: 46px; max-width: 34ch; }

  /* ---------- kind: messages ---------- */
  .msg-list { display: grid; gap: 24px; margin-top: 42px; }
  .msg {
    background: var(--glass-face);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.24), 0 24px 50px -30px rgba(0,0,0,.7);
    border-radius: 26px; padding: 26px 32px;
    display: grid; gap: 10px;
    /* The stripe marks these as the thing being warned about. */
    border-inline-start: 5px solid var(--accent);
  }
  .msg .from {
    font-size: 25px; color: var(--olive); font-weight: 600;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    /* Latin sender IDs and phone numbers need LTR to render correctly, but
       they should still hang off the same edge as the Arabic body. */
    direction: ltr; text-align: right; unicode-bidi: embed;
  }
  .msg .body { font-size: 33px; line-height: 1.5; color: #e9f4ed; }

  /* ---------- kind: statement ---------- */
  .statement h1 { font-size: 82px; }
  .statement .body {
    font-size: 40px; line-height: 1.7; color: #c8e0d3;
    margin-top: 28px; max-width: 40ch;
    border-inline-start: 5px solid var(--olive);
    padding-inline-start: 30px;
  }

  /* ---------- kind: stage ----------
     Backdrop for the portrait phone recording. The right half is left clear:
     build.mjs centres the video there, so nothing may be drawn into it. */
  .stage { display: grid; grid-template-columns: 1fr 560px; align-items: center; gap: 60px; }
  .stage h1 { font-size: 76px; }
  .stage ul { list-style: none; display: grid; gap: 18px; margin-top: 36px; }
  .stage li {
    font-size: 34px; color: #c8e0d3; line-height: 1.4;
    display: flex; align-items: center; gap: 18px;
  }
  .stage li::before {
    content: ''; width: 12px; height: 12px; border-radius: 3px;
    background: var(--olive); flex: none;
  }
  .stage .slot { height: 940px; }

  /* ---------- kind: chapter ----------
     Divider between sections of the deep dive. The big number gives viewers a
     fix on where they are in a long video. */
  .chapter { display: grid; justify-items: center; text-align: center; }
  .chapter .no {
    font-size: 210px; font-weight: 700; line-height: 1;
    color: rgba(255,255,255,.16);
    font-variant-numeric: tabular-nums;
    margin-bottom: -46px;
  }
  .chapter h1 { font-size: 92px; }
  .chapter .sub { font-size: 38px; max-width: 34ch; }

  /* ---------- kind: outro ---------- */
  .outro { text-align: center; display: grid; justify-items: center; }
  .outro .stats {
    display: flex; gap: 20px; margin-bottom: 60px;
  }
  .stat {
    background: var(--glass-face);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.26);
    border-radius: 26px; padding: 28px 44px; min-width: 230px;
  }
  .stat b { display: block; font-size: 72px; font-weight: 700; line-height: 1.1; }
  .stat span { font-size: 25px; color: #a9cdb8; }
  .outro .logo { width: 132px; height: 132px; margin-bottom: 26px; }
  .outro h1 { font-size: 104px; }
  .outro .sub { font-size: 36px; }
</style>
</head>
<body>
  <div class="frame" id="frame"></div>

<script>
  // Exposed rather than run on load: render-cards.mjs calls this once it has
  // injected the scene data and the inlined logo.
  window.renderCard = function renderCard(card, markSvg) {
  const frame = document.getElementById('frame')

  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const logo = (cls) => `<span class="${cls}">${markSvg}</span>`

  const eyebrow = (text) =>
    text ? `<span class="eyebrow">${markSvg.replace('<svg', '<svg class="mark"')}${esc(text)}</span>` : ''

  const kinds = {
    title: (c) => `
      <div class="title-card">
        ${logo('logo')}
        <h1>${esc(c.title)}</h1>
        <p class="sub">${esc(c.subtitle)}</p>
        <p class="foot">${esc(c.footer)}</p>
      </div>`,

    messages: (c) => `
      <div>
        ${eyebrow(c.eyebrow)}
        <h1>${esc(c.title)}</h1>
        <div class="msg-list">
          ${c.messages.map((m) => `
            <div class="msg">
              <div class="from">${esc(m.from)}</div>
              <div class="body">${esc(m.body)}</div>
            </div>`).join('')}
        </div>
      </div>`,

    statement: (c) => `
      <div class="statement">
        ${eyebrow(c.eyebrow)}
        <h1>${esc(c.title)}</h1>
        <p class="body">${esc(c.body)}</p>
      </div>`,

    stage: (c) => `
      <div class="stage">
        <div>
          ${eyebrow(c.eyebrow)}
          <h1>${esc(c.title)}</h1>
          <ul>${c.points.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
        </div>
        <div class="slot"></div>
      </div>`,

    chapter: (c) => `
      <div class="chapter">
        <div class="no">${esc(c.number)}</div>
        <h1>${esc(c.title)}</h1>
        ${c.subtitle ? `<p class="sub">${esc(c.subtitle)}</p>` : ''}
      </div>`,

    outro: (c) => `
      <div class="outro">
        <div class="stats">
          ${c.stats.map((s) => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}
        </div>
        ${logo('logo')}
        <h1>${esc(c.title)}</h1>
        <p class="sub">${esc(c.subtitle)}</p>
        <p class="foot">${esc(c.footer)}</p>
      </div>`,
  }

  frame.innerHTML = kinds[card.kind](card)
  // render-cards.mjs waits on this flag rather than a fixed timeout.
  document.documentElement.dataset.ready = '1'
  }
</script>
</body>
</html>
