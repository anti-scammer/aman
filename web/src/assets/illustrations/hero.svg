<svg viewBox="0 0 480 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digital protection shield scanning a phone">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a6b3c"/>
      <stop offset="1" stop-color="#0c3b20"/>
    </linearGradient>
    <linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9e5f"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <!-- soft backdrop -->
  <ellipse cx="240" cy="312" rx="176" ry="20" fill="#0c3b20" opacity="0.08"/>
  <circle cx="240" cy="176" r="150" fill="#eaf5ee"/>
  <circle cx="240" cy="176" r="150" stroke="#c7e4d2" stroke-width="2" stroke-dasharray="4 8"/>
  <!-- phone -->
  <rect x="150" y="96" width="132" height="196" rx="20" fill="#ffffff" stroke="#14532d" stroke-width="3"/>
  <rect x="164" y="118" width="104" height="152" rx="10" fill="#f8faf8"/>
  <rect x="196" y="106" width="40" height="7" rx="3.5" fill="#c7e4d2"/>
  <!-- scan lines on phone -->
  <rect x="178" y="140" width="76" height="9" rx="4.5" fill="#d9ede0"/>
  <rect x="178" y="158" width="54" height="9" rx="4.5" fill="#d9ede0"/>
  <rect x="178" y="176" width="66" height="9" rx="4.5" fill="#d9ede0"/>
  <!-- shield emblem over phone -->
  <path d="M300 150c0 46-32 68-48 74-16-6-48-28-48-74l48-16 48 16Z" fill="url(#hg2)" transform="translate(-36 6)"/>
  <path d="M264 168l-12 14-6-7" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- magnifier -->
  <circle cx="332" cy="212" r="40" fill="#ffffff" stroke="url(#hg)" stroke-width="7"/>
  <circle cx="332" cy="212" r="24" fill="#eaf5ee"/>
  <path d="M362 242l26 26" stroke="#14532d" stroke-width="9" stroke-linecap="round"/>
  <path d="M322 212l8 9 16-19" stroke="#1a6b3c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tatreez diamonds accent -->
  <g fill="#ce1126">
    <path d="M110 120l7 7-7 7-7-7z"/>
    <path d="M96 176l6 6-6 6-6-6z" opacity="0.6"/>
    <path d="M126 210l5 5-5 5-5-5z" opacity="0.4"/>
  </g>
  <g fill="#1a6b3c">
    <path d="M372 128l7 7-7 7-7-7z"/>
    <path d="M392 168l6 6-6 6-6-6z" opacity="0.6"/>
  </g>
</svg>
