server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arabic content compresses well; the JS bundle is ~340 kB uncompressed.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy the API so the SPA can use a relative base URL (/api) and the
    # browser never hits a cross-origin request.
    location /api/ {
        # Resolve the backend per request via Docker's embedded DNS, not once
        # at startup: a literal upstream makes nginx refuse to boot while the
        # backend is still starting, and pins a stale IP if it is recreated.
        # $request_uri already carries /api/... plus the query string.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream backend:3000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — React Router owns the routes, including /admin. Without
    # this, reloading any non-root URL would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
